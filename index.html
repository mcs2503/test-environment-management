<!DOCTYPE html>
<html>
<head>
    <title>Video Streams</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h1>Live Streams</h1>
    <video id="video1" controls></video>
    <video id="video2" controls></video>
    <script>
        if (Hls.isSupported()) {
            var video1 = document.getElementById('video1');
            var hls1 = new Hls();
            hls1.loadSource('http://localhost:31545/live/video-stream-6cc49ff468-kcn8g.m3u8');
            hls1.attachMedia(video1);
            hls1.on(Hls.Events.MANIFEST_PARSED, function() {
                video1.play();
            });
        }
	if (Hls.isSupported()) {
            var video2 = document.getElementById('video2');
            var hls2 = new Hls();
            hls2.loadSource('http://localhost:31545/live/video-stream-6cc49ff468-pnfsk.m3u8');
            hls2.attachMedia(video2);
            hls2.on(Hls.Events.MANIFEST_PARSED, function() {
                video2.play();
            });
        }
    </script>
</body>
</html>
